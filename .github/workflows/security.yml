name: 🛡️ DevSecOps & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Análisis periódico todos los lunes a las 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==================================================
  # 1. Escaneo de Dependencias Vulnerables (npm audit)
  # ==================================================
  dependency-audit:
    name: 📦 Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Install Dependencies
        working-directory: ./back
        run: npm ci

      - name: Run Strict NPM Security Audit
        working-directory: ./back
        run: npm audit --audit-level=high

  # ==================================================
  # 2. Análisis Estático de Código (CodeQL SAST)
  # ==================================================
  codeql-analysis:
    name: 🔍 CodeQL Static Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ==================================================
  # 3. Detección de Fuga de Secretos (Gitleaks)
  # ==================================================
  secret-scan:
    name: 🔑 Secret & Credential Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
